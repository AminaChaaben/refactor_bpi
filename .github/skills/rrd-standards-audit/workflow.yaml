# Refactor Detective workflow: rrd-standards-audit
name: rrd-standards-audit
# prettier-ignore
description: 'Audit governance/standards gaps (missing conventions docs, Definition-of-Done, lint config, CODEOWNERS) using a completed rrd-audit-all run as evidence that unwritten conventions are being violated. Use when the user says "audit standards" or "check governance" after an audit-all run'

config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""

default_output_file: "{rrd_artifacts}/standards-audit-{target_project}-{date}.md"
diff_output_folder: "{target_project_root}/proposals"

required_tools:
  - Bash
  - Grep
  - Glob
  - Read
  - write_file

tags:
  - refactor-radar
  - governance
  - standards
  - conventions

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
