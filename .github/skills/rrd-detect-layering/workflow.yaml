# Refactor Detective workflow: rrd-detect-layering
name: rrd-detect-layering
# prettier-ignore
description: 'Find architecture/layering gaps: mixed responsibilities in one directory, cross-layer violations (assertions in page objects, raw data access in tests), inconsistent naming conventions. Use when the user says "detect layering issues" or "audit project architecture"'

config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""

default_output_file: "{rrd_artifacts}/detect-layering-{target_project}.md"
diff_output_folder: "{target_project_root}/proposals"

required_tools:
  - Bash
  - Read
  - Grep
  - write_file

tags:
  - refactor-radar
  - architecture
  - layering
  - naming-conventions

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
