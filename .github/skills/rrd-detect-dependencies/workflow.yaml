# Refactor Detective workflow: rrd-detect-dependencies
name: rrd-detect-dependencies
# prettier-ignore
description: 'Find test-to-test coupling and cascade risk from shared fixtures, order-dependence, or shared live app/data state. Use when the user says "detect dependencies" or "find test coupling"'

# Critical variables from config
config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

# Workflow components
installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

# Variables and inputs
variables:
  target_project: "" # resolved via code-graph status in step 1

# Output configuration
default_output_file: "{rrd_artifacts}/detect-dependencies-{target_project}.md"
diff_output_folder: "{target_project_root}/proposals" # always the TARGET project's own proposals/, never this skill's folder

# Required tools
required_tools:
  - Bash
  - Read
  - Grep
  - write_file

tags:
  - refactor-radar
  - dependencies
  - coupling
  - cascade-risk

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
