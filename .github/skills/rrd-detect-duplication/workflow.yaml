# Refactor Detective workflow: rrd-detect-duplication
name: rrd-detect-duplication
# prettier-ignore
description: 'Find redundant or near-duplicate code via structural graph similarity. Use when the user says "detect duplication" or "find duplicate test code"'

config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""
  similarity_threshold: "default" # owner may narrow/widen the net

default_output_file: "{rrd_artifacts}/detect-duplication-{target_project}.md"
diff_output_folder: "{target_project_root}/proposals"

required_tools:
  - Bash
  - Read
  - Grep
  - write_file

tags:
  - refactor-radar
  - duplication
  - similarity
  - maintenance

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
