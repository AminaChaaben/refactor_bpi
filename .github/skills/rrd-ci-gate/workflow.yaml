# Refactor Detective workflow: rrd-ci-gate
name: rrd-ci-gate
# prettier-ignore
description: 'Run rrd-audit-all and fail if any Critical opportunity is new since the last tracked run. Use when the user says "run the refactor radar CI gate" or wants an audit wired into a pipeline'

config_source: "{project-root}/_bmad/rrd/config.yaml"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""

required_tools:
  - Bash
  - Grep
  - Read

tags:
  - refactor-radar
  - ci
  - gate
  - pipeline

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
