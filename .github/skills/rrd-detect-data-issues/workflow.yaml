# Refactor Detective workflow: rrd-detect-data-issues
name: rrd-detect-data-issues
# prettier-ignore
description: 'Find shared/non-reusable test data and missing setup/teardown lifecycle gaps. Use when the user says "detect data issues" or "find test data collisions"'

config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""

default_output_file: "{rrd_artifacts}/detect-data-issues-{target_project}.md"
diff_output_folder: "{target_project_root}/proposals"

required_tools:
  - Bash
  - Read
  - Grep
  - write_file

tags:
  - refactor-radar
  - data-lifecycle
  - test-data
  - collisions

execution_hints:
  interactive: false
  autonomous: true
  iterative: false
