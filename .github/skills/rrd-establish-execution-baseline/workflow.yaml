# Refactor Detective workflow: rrd-establish-execution-baseline
name: rrd-establish-execution-baseline
# prettier-ignore
description: 'Get any test suite from zero (or insufficient) real execution runs to N genuine, preserved runs, fixing environment/discovery blockers along the way. Use standalone, or as a prerequisite another workflow needs.'

config_source: "{project-root}/_bmad/rrd/config.yaml"
output_folder: "{config_source}:output_folder"
rrd_artifacts: "{config_source}:rrd_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"
date: system-generated

installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

variables:
  target_project: ""
  target_project_root: ""
  run_count: 3

default_output_file: "{target_project_root}/.refactor-radar-logs/manifest.json"
diff_output_folder: "{target_project_root}/proposals"

required_tools:
  - Bash
  - Read
  - Grep
  - read_file
  - write_file
  - bash

tags:
  - refactor-radar
  - baseline
  - toolchain
  - environment

execution_hints:
  interactive: true
  autonomous: false
  iterative: true
